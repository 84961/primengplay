<div class="container mt-4">
    <div class="mb-3">
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="paginationToggle" 
                   [(ngModel)]="isServerSidePagination"
                   (change)="togglePagination()">
            <label class="form-check-label" for="paginationToggle">
                {{ isServerSidePagination ? 'Server-side' : 'Client-side' }} Pagination
            </label>
        </div>
    </div>
    <p-table
      [value]="isServerSidePagination ? products : allProducts"
      [paginator]="true"
      [rows]="10"
      [lazy]="isServerSidePagination"
      [(first)]="first"
      [totalRecords]="totalRecords"
      [loading]="loading"
      styleClass="table table-striped table-hover table-bordered"
      (onLazyLoad)="isServerSidePagination ? loadProducts($event) : null"
    >
      <ng-template pTemplate="header">
        <tr class="table-dark">
          <th scope="col" class="text-center py-3">id</th>
          <th scope="col" class="text-center py-3">Product Name</th>
          <th scope="col" class="text-center py-3">Price</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-pdt>
        <tr>
          <td class="text-center py-2 px-3">{{ pdt.id }}</td>
          <td class="py-2 px-3">{{ pdt.title }}</td>
          <td class="text-end py-2 px-3">{{ pdt.price | currency }}</td>
        </tr>
      </ng-template>
    </p-table>
</div>

{{first}}
